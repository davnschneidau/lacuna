[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna"
version = "3.0.0"
description = "Agentic, multi-repo, application-level security scanner"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lacuna contributors" }]
dependencies = [
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "httpx>=0.27.0",
    "anyio>=4.3.0",
    "mcp>=0.9.0",
    "tree-sitter>=0.21.0",
    "tree-sitter-languages>=1.10.2",
    "gitpython>=3.1.43",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.7.1",
    "structlog>=24.1.0",
    "rich>=13.7.1",
    "jinja2>=3.1.3",
    "pydantic>=2.6.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
]
# Deep-oracle and headless-browser DAST extras. These are heavyweight
# (sqlmap, playwright + chromium, ysoserial JAR install) and installed in
# the Docker image rather than the base wheel.
oracles = [
    "sqlmap>=1.8.0",
    "playwright>=1.43.0",
    "semgrep>=1.70.0",
    "angr>=9.2.0",
]

[project.scripts]
lacuna = "lacuna.__main__:cli"
lacuna-recon-server = "lacuna.tools.recon_server:main"
lacuna-kg-server = "lacuna.tools.kg_server:main"
lacuna-dast-server = "lacuna.tools.dast_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lacuna = ["kg/schema.sql", "reports/*.md", "reports/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
