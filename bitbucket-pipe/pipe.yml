name: Lacuna Security Scanner
# Bump this tag in lock-step with src/lacuna/__init__.py. The release
# CI workflow (and scripts/lint_versions.py locally) verify the two are
# identical and fail the build if they drift.
image: lacuna:3.1.1
description: Agentic, application-level security scanner. SAST and DAST for multi-repo applications, powered by Claude Code through Azure Foundry.
# Replace <your-workspace> with the Bitbucket workspace slug that hosts your
# fork of the pipe before publishing.
repository: https://bitbucket.org/<your-workspace>/lacuna
maintainer: security@example.com
tags:
  - security
  - sast
  - dast
  - agentic
  - ai

variables:
  - name: LACUNA_MANIFEST
    description: Path to the application manifest within the primary repo.
    default: "app.lacuna.yaml"

  - name: LACUNA_MODE
    description: |
      Legacy scan mode selector. Translated into LACUNA_SCAN_KIND /
      LACUNA_SCAN_SCOPE at runtime by lacuna.kind.parse_legacy_mode.
      Operators are encouraged to set LACUNA_SCAN_KIND and
      LACUNA_SCAN_SCOPE directly; LACUNA_MODE is kept for back-compat
      with existing pipelines.
    default: "sast"
    allowed-values:
      - "sast"
      - "sast+dast"
      - "diff"
      - "diff-sast+dast"

  - name: LACUNA_SCAN_KIND
    description: |
      Scan-kind selector. ``sast`` registers only the static MCP
      servers; ``sast_dast`` additionally registers ``lacuna-dast``
      and recruits the DAST-capable agents declared in
      ``.claude/topology.yaml``. Overrides LACUNA_MODE when set.
    default: ""
    allowed-values:
      - ""
      - "sast"
      - "sast_dast"

  - name: LACUNA_SCAN_SCOPE
    description: |
      Scan-scope selector. ``full`` scans every repo declared in the
      manifest; ``diff`` scans only the files in the diff and their
      transitive imports.
    default: ""
    allowed-values:
      - ""
      - "full"
      - "diff"

  - name: LACUNA_FAIL_ON
    description: Severity threshold that causes a non-zero exit code.
    default: "critical"
    allowed-values:
      - "none"
      - "critical"
      - "high"
      - "medium"

  - name: AZURE_FOUNDRY_ENDPOINT
    description: Anthropic-compatible Azure AI Foundry endpoint URL.

  - name: AZURE_FOUNDRY_KEY
    description: Foundry API key. Alternative — AZURE_FOUNDRY_AAD_TOKEN.
    secured: true

  - name: AZURE_FOUNDRY_AAD_TOKEN
    description: Entra/AAD bearer token. Mutually exclusive with AZURE_FOUNDRY_KEY.
    secured: true

  - name: BITBUCKET_USERNAME
    description: Bitbucket username for cloning additional repos in the manifest.

  - name: BITBUCKET_APP_PASSWORD
    description: App password paired with BITBUCKET_USERNAME.
    secured: true

  - name: BITBUCKET_ACCESS_TOKEN
    description: Alternative — workspace access token (preferred over App Password).
    secured: true

  - name: LACUNA_WALL_CLOCK_HOURS
    description: Hard cap on scan wall-clock time.
    default: "4"

  - name: LACUNA_BUDGET_USD
    description: Estimated spend cap (Foundry token costs).
    default: "50"
