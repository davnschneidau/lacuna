name: chain-builder
input_caps:
  max_input_tokens: 14000
  must_include_in_context:
    - "/memory/application_model.md"
    - "primitives ledger (list of all primitives)"
    - "service map summary"
  must_not_include_in_context:
    - "raw findings prose"
    - "code excerpts"
    - "validator transcripts"
    - "hypothesis descriptions"
output_caps:
  max_output_tokens: 8000
expected_outputs:
  - "zero or more kg.write.chain calls (with full narrative_md)"
  - "kg.write.mark_primitive_explored for every primitive returned by kg.read.primitives"
  - "kg.write.set_exit_criterion(name='chain_search_exhausted', met=True)"
