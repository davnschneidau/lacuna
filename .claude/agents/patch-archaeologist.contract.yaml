name: patch-archaeologist
input_caps:
  max_input_tokens: 15000
  must_include_in_context:
    - "/memory/application_model.md"
    - "/memory/current_phase.md"
  must_not_include_in_context:
    - "/memory/confirmed_findings/"
    - "/memory/refuted_hypotheses/"
output_caps:
  max_output_tokens: 6000
expected_outputs:
  - "At least one kg.write.hypothesis call (with parent_finding_id set), OR"
  - "A kg.write.event with event_type=patch_archaeologist_no_variants"
