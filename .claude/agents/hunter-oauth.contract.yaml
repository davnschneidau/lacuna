name: hunter-oauth
input_caps:
  max_input_tokens: 14000
  must_include_in_context:
    - "/memory/application_model.md"
    - "/memory/current_phase.md"
  must_not_include_in_context:
    - "/memory/confirmed_findings/"
    - "/memory/refuted_hypotheses/"
output_caps:
  max_output_tokens: 4000
expected_outputs:
  - "At least one kg.write.hypothesis call for each discovered OAuth/OIDC shape, OR"
  - "A kg.write.event with event_type=hunter_no_findings explaining why none"
